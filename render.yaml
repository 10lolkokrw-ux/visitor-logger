services:
  - type: web
    name: visitor-logger
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: visitors.db
      - key: RETENTION_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
